version: "3.8" # 이 docker-compose 파일이 어떤 버전 문법을 따를지 결정, 3.8은 자주 쓰이는 안정적인 버전

services: # 여기부터 컨테이너 정의를 시작한다는 뜻, (app, db) 같은 서비스슬 여러 개 적을 수 있음
  app: # Node.js 애플리케이션(코드)이 실행될 컨테이너 이름, Compose 안에서 "app" 이라는 이름으로 불림
    build: . # 현재 디렉토리(.)에 있는 Dockerfile을 사용해서 이미지 빌드하라는 뜻
    env_file: # .env 파일에서 환경변수를 불러와 사용, DB 접속 정보나 비밀번호 같은 민감한 정보는 .env에 적고 여기서 가져옴
      - .env # 실제 불러온 파일 이름, 여러개 지정도 가능
    depends_on: # 이 서비스(app)가 시작하기 전에 반드시 db를 먼저 실행하라는 뜻, Node.js는 DB가 떠 있어야 연결할 수 있으니까 필요
      - db # 의존할 서비스 이름 -> 여기서는 MySQL 컨테이너
    command:
      [
        "./wait-for-it.sh",
        "db:3306",
        "--timeout=60",
        "--",
        "node",
        "src/index.js",
      ]

  db: # MySQL DB 컨테이너 정의
    image: mysql:8.0 # MySQL 8.0 버전의 공식 Docker 이미지를 사용
    env_file: # MySQL 컨테이너도 .env 파일에서 환경변수를 가져옴
      - .env # 실제 불러온 파일 이름
    ports: # 컨테이너 안의 포트를 호스트(내 컴퓨터)랑 연결해주는 설정, 외부에서 db에 접속하거나 확인할 때 필요
      - "3307:3306" # 왼쪽 3307: 내 컴퓨터에서 연결할 포트, 오른쪽 3306: MySQL 컨테이너 내부 기본 포트
    volumes: # DB 데이터를 컨테이너 외부(볼륨)에 저장, 컨테이너를 삭제해도 데이터는 유지됨
      - db-data:/var/lib/mysql # 왼쪽 db-data: 우리가 정의한 볼륨 이름, 오른쪽 /var/lib/mysql: MySQL의 실제 데이터 저장 경로, 즉 MySQL 데이터를 db-data라는 외부 저장소에 보관

volumes: # 이 Compose 파일에서 사용할 볼륨(외부 저장소)을 정의
  db-data: # db-data라는 이름의 빈 볼륨을 새로 만든다는 뜻, Docker가 자동으로 물리적인 디렉토리를 만들어 관리
