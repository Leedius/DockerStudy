server {                                # 서버 블록을 정의 
    listen 80;                          # 어떤 포트에서 클라이언트 요청을 받을지 설정
    server_name localhost;              # 어떤 도메인 이름 요청에 응답할지 

    location / {                        # 어떤 요청 경로에 대해 어떤 처리를 할지 정의 /는 루트 요청
        root /usr/share/nginx/html;     # 해당 location 블록에서 제공할 정적 파일의 실제 경로 ( 컨테이너 내부의 경로)
        index index.html;               # 해당 경로에 접근했을 때 기본으로 보여줄 파일을 지정
    }
}