version: "3.8" # Docker Compose 파일의 버전

services: # 실행할 컨테이너들을 정의하는 공간
  web: # 컨테이너의 이름(별명)
    image: nginx:stable-alpine # 사용할 기반 Docker 이미지 alpine은 경량형 버전
    ports: # 컨테이너 내부 포트 연결
      - "8080:80" # 사용자가 브라우저에 localhost:8080 입력하면 -> 실제론 컨테이너 안의 80번 포트로 연결
    volumes:
      - ./html:/usr/share/nginx/html # ./html : 내 컴퓨터(호스트)의 폴더 경로,  /usr/share/nginx/html : Nginx 컨테이너 내부에서 정적 파일을 찾는 디렉토리
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # ./nginx/default.conf : 내 컴퓨터의 Nginx 설정파일, Nginx가 실제로 사용하는 설정파일 위치
